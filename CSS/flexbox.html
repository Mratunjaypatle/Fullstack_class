<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box </title>
    <link rel="stylesheet" href="flexbox.css">
</head>

<body>

    <!-- 
    Flexbox -> It is a one dimensional layout method for arranging items in rows and columns , it is important for responsive websites.. 
    justify content -> CSS property aligns items within a flex or grid container along the main axis
     background: #16213e;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
         background: #1a1a2e;
      -->

    <div class="container">
        <div style="background-color: cornflowerblue;">Cornflowerblue</div>
        <div style="background-color: aqua;">Aqua</div>
        <div style="background-color: violet;">Violet</div>
        <div style="background-color: grey;">Grey</div>
        <div style="background-color: pink;">Pink</div>
        <div style="background-color: burlywood;">Burlywood</div>
        <div style="background-color: crimson;">Crimson</div>
    </div>


    <div id="wrap">
        <div style="background-color: azure;">Azure</div>
        <div style="background-color: aqua;">Aqua</div>
        <div style="background-color: violet;">Violet</div>
        <div style="background-color: grey;">Grey</div>
        <div style="background-color: darkcyan;">DarkCyan</div>
        <div style="background-color: burlywood;">Burlywood</div>

    </div>
</body>

</html>
