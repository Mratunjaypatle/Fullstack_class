<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        li {
            color: crimson;
        }

        body {
         background: linear-gradient(to right, #f0c27b, #4b1248);

        }
    </style>
</head>

<body>
    <h3>CSS -> Cascading Style Sheet</h3>

    <pre>
            There are 3 types of css..
            <ol>
                <li style="color: cornflowerblue;">Inline CSS -> We apply css in a line , we use style as an attribute.. .. </li>

                <li>Internal CSS -> We apply css using style as a tag... </li>

            </ol>
        </pre>
</body>

</html>

<!-- style -> It is an attribute as well as a tag -->
