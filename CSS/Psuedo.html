<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classes</title>
    <style>
        body {
            background-color: #1a1a2e;
        }

        .btn {
            padding: 50px;
            margin: 10px auto;
            width: 80%;
            height: 200px;
            border: 2px solid white;
            background: #324371;
        }

        .btn:hover {
            background-color: darkcyan;
            width: 50%;
        }

        .btn button {
            border-radius: 10px;
            margin: 20px;
            width: 100px;
            background-color: rgb(23, 135, 160);
            color: white;
        }

        #btn1:hover

        /*after touching actions performed*/
            {
            background-color: aqua;
            color: black;
        }

        #btn2:hover {
            background-color: pink;
            color: black;
        }
    </style>
</head>

<body>
    <div class="btn">
        <div><button id="btn1">Sign in </button></div>
        <div><button id="btn2">Click me ..!</button></div>
    </div>
</body>

</html>
